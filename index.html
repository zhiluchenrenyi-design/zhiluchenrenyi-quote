<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>智嵂報價特助</title>
  <style>
    * { box-sizing: border-box; font-family: 'Helvetica Neue', Arial, sans-serif; }
    body { margin: 0; background-color: #F4F5F7; color: #111; }
    nav { padding: 16px; background: #fff; border-bottom: 1px solid #ddd; font-weight: bold; }
    .tab-bar { display: flex; background: #fff; border-bottom: 1px solid #ddd; }
    .tab-item { flex: 1; text-align: center; padding: 12px; cursor: pointer; color: #888; font-weight: bold; }
    .tab-item.active { color: #111; border-bottom: 2px solid #111; }
    .container { padding: 16px; max-width: 900px; margin: 0 auto; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .card { background: #fff; border-radius: 8px; padding: 16px; margin-bottom: 16px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #444; }
    .form-input { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; }
    textarea.form-input { resize: vertical; min-height: 80px; line-height: 1.5; }
    .btn { padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 14px; width: 100%; margin-bottom: 8px; transition: opacity 0.2s; }
    .btn:hover { opacity: 0.85; }
    .btn-primary { background: #111; color: #fff; }
    .btn-success { background: #28a745; color: #fff; }
    .btn-info { background: #17a2b8; color: #fff; }
    .btn-warning { background: #f59f00; color: #fff; }
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 1000; align-items: center; justify-content: center; }
    .modal-box { background: #fff; padding: 20px; border-radius: 8px; width: 90%; max-width: 600px; max-height: 90vh; overflow-y: auto; }
    .search-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <nav>智嵂報價特助 - 內部建檔系統</nav>
  <div class="tab-bar">
    <div class="tab-item active" onclick="switchTab('tab1')">01_需求與建檔</div>
    <div class="tab-item" onclick="switchTab('tab2')">02_歸檔與追蹤</div>
  </div>

  <div class="container">
    <!-- 01區 -->
    <div id="tab1" class="tab-content active">
      <div class="card">
        <h3>📄 委任書建檔 (格式完美對齊版)</h3>
        <input type="hidden" id="reqId">
        <input type="hidden" id="docId">
        <input type="hidden" id="pdfId">
        <input type="hidden" id="pdfUrl">
        
        <div style="display:flex; gap:8px;">
          <div class="form-group" style="flex:1"><label>公司名稱</label><input type="text" id="companyName" class="form-input"></div>
          <div class="form-group" style="flex:1"><label>代表人</label><input type="text" id="rep" class="form-input"></div>
        </div>
        <div class="form-group"><label>地址</label><input type="text" id="address" class="form-input"></div>
        <div style="display:flex; gap:8px;">
          <div class="form-group" style="flex:1"><label>電話</label><input type="text" id="phone" class="form-input"></div>
          <div class="form-group" style="flex:1"><label>合約書簽署日期</label><input type="text" id="signDate" class="form-input" placeholder="中華民國 115 年 08 月 01 日"></div>
        </div>

        <hr style="margin:20px 0; border:0; border-top:1px dashed #ccc;">
        
        <div class="form-group"><label>主旨</label><textarea id="subject" class="form-input" rows="2">承 貴公司委任智律會計師事務所（以下簡稱本事務所）辦理公司會計帳務處理、各項稅務之申報相關作業等服務，謹開列下列工作範圍及條件，請查照惠予同意並賜復。</textarea></div>
        <div class="form-group"><label>一、委任方法</label><textarea id="method" class="form-input" rows="2">本事務所將依據財政部發布之「所得稅法」相關規定，辦理會計帳務處理，並提供有關之諮詢服務。</textarea></div>
        <div class="form-group"><label>二、工作內容 (明細)</label><textarea id="workDetail" class="form-input" rows="5">(一) 每年會計帳務處理
(二) 其他各項稅務申報：
  1. 個人綜合所得稅申報。
  2. 各類所得扣繳申報（不含個別員工之薪資計算）。
  3. 每半年業務狀況調查表填寫。</textarea></div>
        <div class="form-group"><label>二、工作內容 (聲明)</label><textarea id="workStatement" class="form-input" rows="4">為順利達成上列工作，貴公司應提供應有之文件、憑證，並答覆有關問題之詢問；每期營業稅申報日截止前十日（即單數月五日以前），貴公司應交付相關憑證供本事務所整理申報。對貴公司所提供之一切資料本事務所均將嚴守秘密，惟當業務事件主管機關依法向本事務所查詢或調閱有關之工作底稿時，本事務所不得拒絕或規避。</textarea></div>
        <div class="form-group"><label>三、酬金 (前綴)</label><textarea id="feePrefix" class="form-input" rows="1">第二條所列之工作內容之委任酬金如下：</textarea></div>
        <div class="form-group"><label>三、酬金 (明細)</label><textarea id="feeDetail" class="form-input" rows="4">(一) 每年各項業務處理費用：新台幣 19,800 元/每年簽約時收取。
(二) 其他服務（每年增收之工作酬金）：
  1. 各類所得及股利憑單扣繳申報：新台幣 1600 元/每年簽約時收取。
  2. 綜合所得稅申報：新台幣 1600 元/簽約時收取。</textarea></div>
        <div class="form-group"><label>三、酬金 (後綴約定)</label><textarea id="feeSuffix" class="form-input" rows="6">各項規費、稅金、郵資、交通費、代刻印鑑、代購發票及其他因提供服務而發生之代墊費用，應由貴公司負擔。代墊費用將由本事務所按實際發生金額製據向 貴公司收取，貴公司應於收到本事務所請款單據時，以即期支票、現金或電匯本事務所指定帳戶之方式支付酬金。各項稅金之代繳，貴公司應於該稅金繳納截止日之前一天，連同服務酬金一併支付。本事務所恕不代墊稅金。委任酬金之調整，視貴公司營業額成長，或委任事務增加或帳務日益繁複時，本事務所得要求調整委任酬金。

  委任酬金之調整，委任事務所可就實際工作內容及帳務繁複程度，本事務所得要求調整委任酬金且須經雙方合意始得進行。</textarea></div>
        <div class="form-group"><label>四、委任期間</label><textarea id="period" class="form-input" rows="1">自 2026 年 1 月 01 日至 2026 年 12 月 31 日起。</textarea></div>
        <div class="form-group"><label>五、終止委任</label><textarea id="termination" class="form-input" rows="5">(一) 任一方若欲終止委任，應於委任終止前十日以書面方式告知他方。 
(二) 貴公司如未能於本事務所指定之期限提交相關憑證，或延遲給付酬金達二個月或所提交之帳證文據虛偽不實，本事務所得以書面通知委任人終止其委任合約。 
(三) 本事務所應於委任終止後三十日內將貴公司之各項憑證、文件、帳冊、報表列冊交還 貴公司，貴公司有收受領回之義務，不得拒絕，如有應付未付酬金及代墊費用，貴公司仍應支付。</textarea></div>
        <div class="form-group"><label>六、其他約定事項</label><textarea id="others" class="form-input" rows="8">(一) 委任人深知提供足以公正表達公司財務狀況、營業結果、課稅所得額之憑證及攸關資料，乃委任人之責任，若因提供不實或不完整的資料及憑證，致使受任人遭受有形及 （或）無形損失時，其一切法律責任及損失由委任人負責之。
(二) 除經法院判決確定係受任人之故意或重大過失，受任人因提供本委任書之服務，無論其原因為何，受任人對委任人之最高賠償責任限於返還受任人因提供該項服務或工作成果已收取之公費；倘有任何其他第三人因此向受任人主張任何權利者，無論其原因為何，委任人同意補償並確保受任人及受任人之人員不遭受任何索賠、責任、費用及損失。
(三) 受任人對職務上所獲悉有關委任人經營上之機密應盡保密之責，如有洩密願負法律之責任。
(四) 本事務所若無法與貴公司取得聯絡，致無法繼續辦理委任範圍事項，本事務所應按本函記載之地址書面通知貴公司並限期回覆，貴公司若未於期限內回覆，本事務所僅自限期之次日起二個月內保管貴公司之相關資料，其一切法律責任由 貴公司自負。
(五) 若 貴公司之各稅目有國稅局選案查核之情事，本事務所將視相關補充說明及文件準備所需增加投入之時間，另行報價收費。
(六) 本委任書不含進銷存貨、營業成本與營業收入勾稽等相關報表編製服務，貴公司若因公司內部需求需提供時，本事務所將視相關工作時間，另行報價收費。
(七) 委任人若不於各項申報規定期限日前提供受任人所指定之各項憑證、表報等資料，因而造成遲報滯報時，受任人不須負責。
(八) 若後續服務之範圍或內容與本委任書不一致，將與委任人管理階層就異動內容達成共識，並以書面協議予以約定。
(九) 茲致送本函兩份，如承蒙 貴公司同意由本事務所依本函條款進行服務，請於本函下端簽章後，將其中壹份寄回本事務所。</textarea></div>
        
        <button class="btn btn-primary" onclick="saveDraft()">💾 儲存草稿資料</button>
        <hr style="margin:20px 0; border:0; border-top:1px dashed #ccc;">
        
        <!-- 三階段按鈕流程 -->
        <p style="font-size:13px; color:#666; font-weight:bold;">🚀 輸出與寄送流程 (請依序執行)：</p>
        <div style="display:flex; flex-direction:column; gap:8px;">
          <button class="btn btn-warning" id="btn-doc" onclick="generateDoc()">📄 1. 產出 Word (Google文件) 並手動確認排版</button>
          <div id="doc-link" style="display:none; text-align:center; padding:10px; background:#fff3cd; border-radius:4px;"><a href="#" target="_blank" id="doc-href" style="color:#856404; font-weight:bold;">🔗 點此開啟 Google 文件修改</a></div>
          
          <button class="btn btn-success" id="btn-pdf" onclick="generatePDF()">🔍 2. 將文件轉為 PDF 並預覽</button>
          <div id="pdf-link" style="display:none; text-align:center; padding:10px; background:#d4edda; border-radius:4px;"><a href="#" target="_blank" id="pdf-href" style="color:#155724; font-weight:bold;">🔗 點此開啟/下載最終 PDF</a></div>
          
          <button class="btn btn-info" id="btn-email" onclick="openEmailModal()">📧 3. 寄發 Email 給客戶</button>
        </div>
      </div>
    </div>

    <!-- 02區 -->
    <div id="tab2" class="tab-content">
      <div class="card">
        <div style="display:flex; justify-content:space-between; margin-bottom:12px; align-items:center;">
          <h3 style="margin:0;">🕒 案件追蹤時間軸</h3>
          <button class="btn btn-primary" style="width:auto; height:30px; padding:0 10px; margin:0;" onclick="loadList()">重新整理</button>
        </div>
        <!-- 新增搜尋列 -->
        <div class="search-bar">
          <input type="text" id="searchInput" class="form-input" placeholder="🔍 搜尋公司名稱、單號或日期..." onkeyup="filterList()">
        </div>
        <div id="list-container">載入中...</div>
      </div>
    </div>
  </div>

  <!-- Email 彈窗 -->
  <div class="modal" id="emailModal">
    <div class="modal-box">
      <h3>📧 寄發 Email 報價</h3>
      <div class="form-group"><label>寄件人</label><input type="text" class="form-input" value="zhiluchenrenyi@gmail.com" readonly style="background:#eee;"></div>
      <div class="form-group"><label>收件人 (請填寫客戶信箱)</label><input type="email" id="mail-to" class="form-input" placeholder="example@gmail.com"></div>
      <div class="form-group"><label>主旨</label><input type="text" id="mail-subject" class="form-input"></div>
      <div class="form-group"><label>內文</label><textarea id="mail-body" class="form-input" rows="7">親愛的客戶您好：

附件為您的專屬代理帳務委任書，請您查閱。確認無誤後，請點擊下方專屬連結進行線上簽署：
[線上簽署連結]

智嵂會計師事務所 敬上</textarea></div>
      <div class="form-group">
        <label>附加檔案</label>
        <p style="font-size:12px; color:#28a745; margin:0 0 8px 0;">✅ 系統將自動夾帶剛產出之合約 PDF</p>
        <input type="file" id="mail-files" class="form-input" multiple>
      </div>
      <div style="display:flex; gap:10px;">
        <button class="btn btn-primary" id="btn-send-mail" onclick="sendMail()">🚀 確認發送</button>
        <button class="btn btn-secondary" onclick="document.getElementById('emailModal').style.display='none'">取消</button>
      </div>
    </div>
  </div>

  <script>
    let globalList = [];

    function switchTab(tab) {
      document.querySelectorAll('.tab-content').forEach(e => e.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(e => e.classList.remove('active'));
      document.getElementById(tab).classList.add('active');
      event.target.classList.add('active');
      if(tab==='tab2') loadList();
    }

    function getFormData() {
      return {
        reqId: document.getElementById('reqId').value, companyName: document.getElementById('companyName').value,
        rep: document.getElementById('rep').value, address: document.getElementById('address').value, 
        phone: document.getElementById('phone').value, signDate: document.getElementById('signDate').value,
        subject: document.getElementById('subject').value, method: document.getElementById('method').value,
        workDetail: document.getElementById('workDetail').value, workStatement: document.getElementById('workStatement').value,
        feePrefix: document.getElementById('feePrefix').value, feeDetail: document.getElementById('feeDetail').value,
        feeSuffix: document.getElementById('feeSuffix').value, period: document.getElementById('period').value,
        termination: document.getElementById('termination').value, others: document.getElementById('others').value,
        docId: document.getElementById('docId').value, pdfId: document.getElementById('pdfId').value
      };
    }

    function saveDraft() {
      const data = getFormData();
      if(!data.companyName) return alert("請填寫公司名稱");
      google.script.run.withSuccessHandler(res => {
        document.getElementById('reqId').value = res.reqId; alert("✅ 儲存草稿成功！");
      }).processBackendRouting({action: 'saveDraft', payload: data});
    }

    function generateDoc() {
      const data = getFormData();
      if(!data.companyName) return alert("請先填寫資料並儲存草稿");
      document.getElementById('btn-doc').textContent = "產出文件中..."; document.getElementById('btn-doc').disabled = true;
      google.script.run.withSuccessHandler(res => {
        document.getElementById('docId').value = res.docId;
        document.getElementById('doc-href').href = res.docUrl;
        document.getElementById('doc-link').style.display = 'block';
        document.getElementById('btn-doc').textContent = "📄 1. 產出 Word (Google文件) 並手動確認排版"; 
        document.getElementById('btn-doc').disabled = false;
        saveDraft(); // 自動儲存 docId
      }).processBackendRouting({action: 'generateDoc', payload: data});
    }

    function generatePDF() {
      const data = getFormData();
      if(!data.companyName) return alert("請先填寫資料");
      document.getElementById('btn-pdf').textContent = "PDF 轉檔中..."; document.getElementById('btn-pdf').disabled = true;
      google.script.run.withSuccessHandler(res => {
        document.getElementById('pdfId').value = res.pdfId;
        document.getElementById('pdf-href').href = res.pdfUrl;
        document.getElementById('pdf-link').style.display = 'block';
        document.getElementById('btn-pdf').textContent = "🔍 2. 將文件轉為 PDF 並預覽"; 
        document.getElementById('btn-pdf').disabled = false;
        saveDraft(); // 自動儲存 pdfId
      }).processBackendRouting({action: 'generatePDF', payload: data});
    }

    function openEmailModal() {
      const pdfId = document.getElementById('pdfId').value;
      const reqId = document.getElementById('reqId').value;
      if(!pdfId) return alert("請先完成「步驟 2：產出 PDF」後再發送信件！");
      
      document.getElementById('mail-subject').value = `智嵂會計師事務所 ${document.getElementById('companyName').value}帳務委任書`;
      
      // 替換內文中的簽署連結
      google.script.url.getLocation(loc => {
        const link = `${loc.href.split('?')[0]}?reqId=${reqId}`;
        let body = document.getElementById('mail-body').value;
        document.getElementById('mail-body').value = body.replace(/\[線上簽署連結\].*/s, "[線上簽署連結]\n" + link + "\n\n智嵂會計師事務所 敬上");
      });
      document.getElementById('emailModal').style.display = 'flex';
    }

    function sendMail() {
      const btn = document.getElementById('btn-send-mail');
      const mailTo = document.getElementById('mail-to').value;
      if(!mailTo) return alert("請填寫收件人信箱！");
      btn.textContent = "發送中..."; btn.disabled = true;
      
      const files = document.getElementById('mail-files').files;
      const promises = Array.from(files).map(file => {
        return new Promise(resolve => {
          const reader = new FileReader();
          reader.onload = e => resolve({name: file.name, mimeType: file.type, base64: e.target.result.split(',')[1]});
          reader.readAsDataURL(file);
        });
      });

      Promise.all(promises).then(attachments => {
        const payload = {
          reqId: document.getElementById('reqId').value, pdfId: document.getElementById('pdfId').value,
          toEmail: mailTo, subject: document.getElementById('mail-subject').value,
          body: document.getElementById('mail-body').value, attachmentsBase64: attachments
        };
        google.script.run.withSuccessHandler(() => {
          alert("✅ 信件發送成功，狀態已更新為「已傳送報價」！");
          document.getElementById('emailModal').style.display = 'none';
          btn.textContent = "🚀 確認發送"; btn.disabled = false;
        }).processBackendRouting({action: 'sendContractEmail', payload: payload});
      });
    }

    function loadList() {
      document.getElementById('list-container').innerHTML = "載入中...";
      google.script.run.withSuccessHandler(res => {
        globalList = res;
        renderList(globalList);
      }).processBackendRouting({action: 'getRequirements'});
    }

    function renderList(list) {
      let html = "";
      list.forEach(r => {
        let badgeColor = r.status === "客戶已回傳" ? "#28a745" : (r.status === "已傳送報價" ? "#17a2b8" : "#6c757d");
        html += `<div style="background:#fff; border:1px solid #ddd; padding:12px; border-radius:6px; margin-bottom:10px;">
          <div style="font-weight:bold; font-size:15px;">${r.companyName} <span style="background:${badgeColor}; color:#fff; font-size:11px; padding:2px 6px; border-radius:4px;">${r.status}</span></div>
          <div style="font-size:12px; color:#666; margin-top:4px;">單號: ${r.reqId} | 建立時間: ${r.createTime}</div>
          <button class="btn btn-secondary" style="margin-top:8px; padding:4px 10px; width:auto;" onclick='fillForm(${JSON.stringify(r).replace(/'/g, "&apos;")})'>✏️ 帶入修改</button>
          ${r.pdfUrl ? `<button class="btn btn-success" style="margin-top:8px; padding:4px 10px; width:auto;" onclick="window.open('${r.pdfUrl}')">📄 查看最新 PDF</button>` : ''}
        </div>`;
      });
      document.getElementById('list-container').innerHTML = html || "無案件資料";
    }

    function filterList() {
      const keyword = document.getElementById('searchInput').value.toLowerCase();
      const filtered = globalList.filter(r => 
        (r.companyName && r.companyName.toLowerCase().includes(keyword)) || 
        (r.reqId && r.reqId.toLowerCase().includes(keyword)) || 
        (r.createTime && r.createTime.includes(keyword))
      );
      renderList(filtered);
    }

    function fillForm(r) {
      document.getElementById('reqId').value = r.reqId || ''; document.getElementById('companyName').value = r.companyName || '';
      document.getElementById('rep').value = r.rep || ''; document.getElementById('address').value = r.address || ''; 
      document.getElementById('phone').value = r.phone || ''; document.getElementById('signDate').value = r.signDate || '';

委任酬金之調整，委任事務所可就實際工作內容及帳務繁複程度，本事務所得要求調整委任酬金且須經雙方合意始得進行。</textarea></div>
          <div class="form-group"><label>五、終止委任</label><textarea id="txt-termination" class="form-input" rows="4">(一) 任一方若欲終止委任，應於委任終止前十日以書面方式告知他方。

          <div class="form-group"><label>六、其他約定事項</label><textarea id="txt-other-terms" class="form-input" rows="8">(一) 委任人深知提供足以公正表達公司財務狀況、營業結果、課稅所得額之憑證及攸關資料，乃委任人之責任，若因提供不實或不完整的資料及憑證，致使受任人遭受有形及（或）無形損失時，其一切法律責任及損失由委任人負責之。
(二) 除經法院判決確定係受任人之故意或重大過失，受任人因提供本委任書之服務，無論其原因為何，受任人對委任人之最高賠償責任限於返還受任人因提供該項服務或工作成果已收取之公費；倘有任何其他第三人因此向受任人主張任何權利者，無論其原因為何，委任人同意補償並確保受任人及受任人之人員不遭受任何索賠、責任、費用及損失。
(三) 受任人對職務上所獲悉有關委任人經營上(包括營業、技術、財務、人事等)之機密應盡保密之責，如有洩密願負法律之責任。
(四) 本事務所若無法與貴公司取得聯絡，致無法繼續辦理委任範圍事項，本事務所應按本函記載之地址書面通知貴公司並限期回覆，貴公司若未於期限內回覆，本事務所僅自限期之次日起二個月內保管貴公司之相關資料，其一切法律責任由 貴公司自負。

(九) 茲致送本函兩份，如承蒙 貴公司同意由本事務所依本函條款進行服務，請於本函下端簽章後，將其中壹份寄回本事務所。</textarea></div>

  <script>
    async function apiCall(action, payload) {
      return new Promise((resolve, reject) => {
        google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).processBackendRouting({ action, payload });
      });
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (URL_REQ_ID) {
        document.getElementById('client-view').style.display = 'block';
        initClientSigningView(URL_REQ_ID);
      } else {
        document.getElementById('admin-view').style.display = 'block';
      }
    });

    // --- 客戶簽署邏輯 ---
    let clientCanvas, clientCtx, clientDrawing = false;
    async function initClientSigningView(reqId) {
      try {
        const data = await apiCall('getContractByReqId', { reqId });
        document.getElementById('cv-title').textContent = `${escapeHtml(data.companyName)} 委任書`;
        document.getElementById('cv-text-body').innerHTML = `
          <p>主旨：<br>${escapeHtml(data.subject)}</p>
          <p><b>一、委任方法：</b><br>${escapeHtml(data.method)}</p>
          <p><b>二、【工作內容】：</b><br>${escapeHtml(data.workCustom)}<br><br>${escapeHtml(data.workDefault)}</p>
          <p><b>三、【酬金及代墊費用】</b><br>${escapeHtml(data.feePrefix)}<br>${escapeHtml(data.feeCustom)}<br><br>${escapeHtml(data.feeSuffix)}</p>
          <p><b>四、【委任期間】：</b><br>${escapeHtml(data.period)}</p>
          <p><b>五、終止委任：</b><br>${escapeHtml(data.termination)}</p>
          <p><b>六、其他約定事項：</b><br>${escapeHtml(data.otherTerms)}</p>
        `;
        document.getElementById('cv-contract-content').style.display = 'block';
        
        clientCanvas = document.getElementById('client-signature-pad');
        clientCtx = clientCanvas.getContext('2d');
        const resize = () => { clientCanvas.width = clientCanvas.parentElement.clientWidth; clientCanvas.height = 200; clientCtx.lineWidth = 3; };
        window.addEventListener('resize', resize); resize();
        
        const getPos = (e) => { const rect = clientCanvas.getBoundingClientRect(); let x = e.clientX, y = e.clientY; if(e.touches) { x = e.touches[0].clientX; y = e.touches[0].clientY; } return { x: x - rect.left, y: y - rect.top }; };
        const start = (e) => { e.preventDefault(); clientDrawing = true; const p = getPos(e); clientCtx.beginPath(); clientCtx.moveTo(p.x, p.y); };
        const draw = (e) => { if(!clientDrawing) return; e.preventDefault(); const p = getPos(e); clientCtx.lineTo(p.x, p.y); clientCtx.stroke(); };
        const stop = () => clientDrawing = false;
        
        clientCanvas.addEventListener('mousedown', start); clientCanvas.addEventListener('mousemove', draw); window.addEventListener('mouseup', stop);
        clientCanvas.addEventListener('touchstart', start, {passive:false}); clientCanvas.addEventListener('touchmove', draw, {passive:false}); window.addEventListener('touchend', stop);
      } catch(e) { alert("合約載入失敗：" + e.message); }
    }
    
    function clearClientSignature() { if(clientCtx) clientCtx.clearRect(0,0, clientCanvas.width, clientCanvas.height); }
    
    async function submitClientContract() {
      const blank = document.createElement('canvas'); blank.width = clientCanvas.width; blank.height = clientCanvas.height;
      if(clientCanvas.toDataURL() === blank.toDataURL()) return alert("請先簽名！");
      document.getElementById('btn-client-submit').disabled = true;
      try {
        await apiCall('clientSubmitSignature', { reqId: URL_REQ_ID, signatureDataUri: clientCanvas.toDataURL() });
        document.getElementById('cv-contract-content').style.display = 'none';
        document.getElementById('cv-success-msg').style.display = 'block';
      } catch(e) { alert("送出失敗：" + e.message); document.getElementById('btn-client-submit').disabled = false; }
    }

    // --- 管理員邏輯 ---
    function switchTab(tabId) {
      document.querySelectorAll('.tab-item, .tab-content').forEach(el => el.classList.remove('active'));
      document.querySelector(`.tab-item[data-target="${tabId}"]`).classList.add('active');
      document.getElementById(tabId).classList.add('active');
      if(tabId === 'tab2') loadRequirements();
    }

    function getFormData() {
      return {
        reqId: document.getElementById('comm-req-id').value, _rowId: document.getElementById('comm-row-id').value,
        pdfId: document.getElementById('comm-pdf-id').value,
        companyName: document.getElementById('comm-company').value, taxId: document.getElementById('comm-taxid').value,
        rep: document.getElementById('comm-rep').value, phone: document.getElementById('comm-phone').value,
        address: document.getElementById('comm-address').value, email: document.getElementById('comm-email').value,
        period: document.getElementById('comm-period').value, signDate: document.getElementById('comm-sign-date').value,
        subject: document.getElementById('txt-subject').value, method: document.getElementById('txt-method').value,
        workCustom: document.getElementById('txt-work-custom').value, workDefault: document.getElementById('txt-work-default').value,
        feePrefix: document.getElementById('txt-fee-prefix').value, feeCustom: document.getElementById('txt-fee-custom').value,
        feeSuffix: document.getElementById('txt-fee-suffix').value, termination: document.getElementById('txt-termination').value,
        otherTerms: document.getElementById('txt-other-terms').value
      };
    }

    async function handleSave() {
      const data = getFormData();
      if(!data.companyName) return alert("請填寫客戶名稱");
      document.getElementById('btn-save').disabled = true;
      try {
        const res = await apiCall('saveDraft', data);
        document.getElementById('comm-row-id').value = res._rowId;
        document.getElementById('comm-req-id').value = res.reqId;
        alert("✅ 儲存成功！");
      } catch(e) { alert("儲存失敗：" + e.message); }
      finally { document.getElementById('btn-save').disabled = false; }
    }

    async function handlePreview() {
      const data = getFormData();
      if(!data.reqId) return alert("請先點擊儲存！");
      document.getElementById('btn-preview').disabled = true;
      try {
        const res = await apiCall('generatePDF', data);
        document.getElementById('comm-pdf-id').value = res.fileId;
        window.open(res.fileUrl, '_blank');
      } catch(e) { alert("PDF 產生失敗：" + e.message); }
      finally { document.getElementById('btn-preview').disabled = false; }
    }

    async function handleSendEmail() {
      const data = getFormData();
      if(!data.pdfId) return alert("請先『預覽產生 PDF』，確保系統已建立文件！");
      if(!data.email) return alert("請填寫客戶 Email！");
      
      const btn = document.getElementById('btn-email'); btn.disabled = true; btn.textContent = "寄送中...";
      try {
        const files = document.getElementById('email-files').files;
        let extraFiles = [];
        for(let f of files) {
          extraFiles.push(await new Promise(res => {
            const r = new FileReader();
            r.onload = e => res({name: f.name, mimeType: f.type, data: e.target.result.split(',')[1]});
            r.readAsDataURL(f);
          }));
        }
        data.extraFiles = extraFiles;
        await apiCall('sendQuoteEmail', data);
        alert("✅ Email 已成功寄出，狀態更新為「已傳送報價」。");
      } catch(e) { alert("寄信失敗：" + e.message); }
      finally { btn.disabled = false; btn.textContent = "📤 寄發 Email"; }
    }

    async function loadRequirements() {
      const list = document.getElementById('timeline-list');
      list.innerHTML = '載入中...';
      try {
        const reqs = await apiCall('getRequirements', {});
        list.innerHTML = reqs.map(r => `
          <div style="border-bottom:1px solid #eee; padding:10px;">
            <b>${escapeHtml(r.companyName)}</b> <span style="color:#666; font-size:12px;">(${r.status})</span><br>
            單號: ${r.reqId}<br>
            <a href="#" onclick='loadForm(${JSON.stringify(r).replace(/'/g, "&apos;")})'>✏️ 載入</a>
          </div>
        `).join('');
      } catch(e) { list.innerHTML = '載入失敗: ' + e.message; }
    }

    function loadForm(item) {
      switchTab('tab1');
      document.getElementById('comm-req-id').value = item.reqId || '';
      document.getElementById('comm-row-id').value = item._rowId || '';
      document.getElementById('comm-company').value = item.companyName || '';
      document.getElementById('comm-taxid').value = item.taxId || '';
      document.getElementById('comm-rep').value = item.rep || '';
      document.getElementById('comm-phone').value = item.phone || '';
      document.getElementById('comm-address').value = item.address || '';
      document.getElementById('comm-email').value = item.email || '';
      document.getElementById('comm-period').value = item.period || '';
      document.getElementById('comm-sign-date').value = item.signDate || '';
      document.getElementById('comm-pdf-id').value = item.pdfId || '';
      
      try {
        if(item.jsonStr) {
          const t = JSON.parse(item.jsonStr);
          document.getElementById('txt-subject').value = t.subject || '';
          document.getElementById('txt-method').value = t.method || '';
          document.getElementById('txt-work-custom').value = t.workCustom || '';
          document.getElementById('txt-work-default').value = t.workDefault || '';
          document.getElementById('txt-fee-prefix').value = t.feePrefix || '';
          document.getElementById('txt-fee-custom').value = t.feeCustom || '';
          document.getElementById('txt-fee-suffix').value = t.feeSuffix || '';
          document.getElementById('txt-termination').value = t.termination || '';
          document.getElementById('txt-other-terms').value = t.otherTerms || '';
        }
      } catch(e){}
    }
    function escapeHtml(str) { return String(str||'').replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;"); }
  </script>
</body>
</html>

  <script>
    async function apiCall(action, payload) {
      const requestData = { action: action, payload: payload };
      try {
        if (typeof google !== 'undefined' && google.script && google.script.run) {
          return await new Promise((resolve, reject) => {
            google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).processBackendRouting(requestData); 
          });
        }
      } catch (error) { throw error; }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (URL_REQ_ID && URL_REQ_ID.trim() !== "") {
        document.getElementById('client-view').style.display = 'block';
        initClientSigningView(URL_REQ_ID);
      } else {
        document.getElementById('admin-view').style.display = 'block';
      }
    });

    // ==========================================
    // 客戶端：純唯讀 HTML 渲染與簽名板
    // ==========================================
    let clientCanvas, clientCtx, clientDrawing = false;
    
    async function initClientSigningView(reqId) {
      try {
        const data = await apiCall('getContractByReqId', { reqId: reqId });
        let company = escapeHtml(data.companyName);
        document.getElementById('cv-title').textContent = `${company} 委任書`;
        
        let contentHTML = `
          <p>主旨：<br>${escapeHtml(data.subject)}</p>
          <p>說明：</p>
          <p><b>一、委任方法：</b><br>${escapeHtml(data.method)}</p>
          <p><b>二、【工作內容】：</b><br>${escapeHtml(data.workCustom)}<br><br>${escapeHtml(data.workDefault)}</p>
          <p><b>三、【酬金及代墊費用】</b><br>${escapeHtml(data.feePrefix)}<br>${escapeHtml(data.feeCustom)}<br><br>${escapeHtml(data.feeSuffix)}</p>
          <p><b>四、【委任期間】：</b><br>${escapeHtml(data.period)}</p>
          <p><b>五、終止委任：</b><br>${escapeHtml(data.termination)}</p>
          <p><b>六、其他約定事項：</b><br>${escapeHtml(data.otherTerms)}</p>
        `;
        document.getElementById('cv-text-body').innerHTML = contentHTML;
        document.getElementById('cv-contract-content').style.display = 'block';
        initClientSignaturePad();
      } catch(err) {
        document.getElementById('cv-title').textContent = "⚠️ 合約載入失敗";
        alert(err.message);
      }
    }

    function initClientSignaturePad() {
      clientCanvas = document.getElementById('client-signature-pad');
      if (!clientCanvas) return;
      clientCtx = clientCanvas.getContext('2d');
      const resize = () => { const rect = clientCanvas.parentElement.getBoundingClientRect(); clientCanvas.width = rect.width; clientCanvas.height = 250; clientCtx.lineWidth = 3; clientCtx.lineCap = "round"; clientCtx.strokeStyle = "#111111"; };
      window.addEventListener('resize', resize); resize();
      
      const getPos = (e) => { const rect = clientCanvas.getBoundingClientRect(); let x = e.clientX, y = e.clientY; if (e.touches && e.touches.length > 0) { x = e.touches[0].clientX; y = e.touches[0].clientY; } return { x: x - rect.left, y: y - rect.top }; };
      const start = (e) => { e.preventDefault(); clientDrawing = true; const p = getPos(e); clientCtx.beginPath(); clientCtx.moveTo(p.x, p.y); };
      const draw = (e) => { if(!clientDrawing) return; e.preventDefault(); const p = getPos(e); clientCtx.lineTo(p.x, p.y); clientCtx.stroke(); };
      const stop = (e) => { if(!clientDrawing) return; e.preventDefault(); clientDrawing = false; };
      
      clientCanvas.addEventListener('mousedown', start); clientCanvas.addEventListener('mousemove', draw); clientCanvas.addEventListener('mouseup', stop); clientCanvas.addEventListener('mouseout', stop);
      clientCanvas.addEventListener('touchstart', start, {passive:false}); clientCanvas.addEventListener('touchmove', draw, {passive:false}); clientCanvas.addEventListener('touchend', stop, {passive:false});
    }

    function clearClientSignature() { if(clientCtx) clientCtx.clearRect(0, 0, clientCanvas.width, clientCanvas.height); }

    async function submitClientContract() {
      const blank = document.createElement('canvas'); blank.width = clientCanvas.width; blank.height = clientCanvas.height;
      if (clientCanvas.toDataURL() === blank.toDataURL()) return alert("請先在簽名板上簽下您的姓名！");
      
      const btn = document.getElementById('btn-client-submit');
      btn.disabled = true; btn.textContent = "合約存檔中，請稍候...";
      
      try {
        const signatureBase64 = clientCanvas.toDataURL();
        await apiCall('clientSubmitSignature', { reqId: URL_REQ_ID, signatureDataUri: signatureBase64 });
        document.getElementById('cv-contract-content').style.display = 'none';
        document.getElementById('cv-success-msg').style.display = 'block';
      } catch (err) {
        alert("傳送失敗：" + err.message);
        btn.disabled = false; btn.textContent = "確認簽署並送出";
      }
    }

    // ==========================================
    // 管理員端邏輯 (01區)
    // ==========================================
    function switchTab(tabId) {
      document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelector(`.tab-item[data-target="${tabId}"]`).classList.add('active');
      document.getElementById(tabId).classList.add('active');
      if(tabId === 'tab2') loadRequirements();
    }

    function getCommFormData() {
      return {
        reqId: document.getElementById('comm-req-id').value,
        _rowId: document.getElementById('comm-row-id').value,
        companyName: document.getElementById('comm-company').value.trim(),
        rep: document.getElementById('comm-rep').value.trim(),
        address: document.getElementById('comm-address').value.trim(),
        phone: document.getElementById('comm-phone').value.trim(),
        signDate: document.getElementById('comm-sign-date').value,
        period: document.getElementById('comm-period').value.trim(),
        subject: document.getElementById('txt-subject').value.trim(),
        method: document.getElementById('txt-method').value.trim(),
        workCustom: document.getElementById('txt-work-custom').value.trim(),
        workDefault: document.getElementById('txt-work-default').value.trim(),
        feePrefix: document.getElementById('txt-fee-prefix').value.trim(),
        feeCustom: document.getElementById('txt-fee-custom').value.trim(),
        feeSuffix: document.getElementById('txt-fee-suffix').value.trim(),
        termination: document.getElementById('txt-termination').value.trim(),
        otherTerms: document.getElementById('txt-other-terms').value.trim()
      };
    }

    async function handleSaveDraft() {
      const data = getCommFormData();
      if (!data.companyName) return alert("請填寫客戶名稱");
      const btn = document.getElementById('btn-save-draft'); btn.disabled = true; btn.textContent = "儲存中...";
      try {
        const res = await apiCall('saveDraft', data);
        document.getElementById('comm-row-id').value = res._rowId;
        document.getElementById('comm-req-id').value = res.reqId;
        alert("✅ 儲存成功！");
      } catch(err) { alert("儲存失敗：" + err.message); } 
      finally { btn.disabled = false; btn.textContent = "💾 儲存資料"; }
    }

    async function handlePreviewPDF() {
      const data = getCommFormData();
      if(!data.reqId) return alert("請先點擊『儲存資料』！");
      const btn = document.getElementById('btn-preview-pdf'); btn.disabled = true; btn.textContent = "產出 PDF 中...";
      try {
        const res = await apiCall('generateAndUploadPDF', data);
        window.open(res.fileUrl, '_blank');
      } catch(err) { alert("PDF 生成失敗：" + err.message); }
      finally { btn.disabled = false; btn.textContent = "📄 預覽產生 PDF"; }
    }

    async function handleSendEmail() {
      const data = getCommFormData();
      const emailTo = document.getElementById('email-to').value.trim();
      if(!data.reqId) return alert("請先儲存資料！");
      if(!emailTo) return alert("請填寫收件人 Email！");
      
      const btn = document.getElementById('btn-send-email'); btn.disabled = true; btn.textContent = "準備寄信中...";
      
      try {
        const fileInput = document.getElementById('email-extra-files');
        let extraFilesBase64 = [];
        if (fileInput.files.length > 0) {
          extraFilesBase64 = await Promise.all(Array.from(fileInput.files).map(async file => {
            return new Promise(resolve => {
                const reader = new FileReader();
                reader.onload = e => resolve({name: file.name, mimeType: file.type, data: e.target.result.split(',')[1]});
                reader.readAsDataURL(file);
            });
          }));
        }
        
        data.emailTo = emailTo;
        data.extraFiles = extraFilesBase64;
        
        await apiCall('sendEmailWithPDF', data);
        alert("✅ Email 已成功寄出！狀態已更新。");
        document.getElementById('email-extra-files').value = ""; // clear
      } catch(err) {
        alert("寄發失敗：" + err.message);
      } finally {
        btn.disabled = false; btn.textContent = "📤 寄發 Email";
      }
    }

    function generateClientLink() {
      const reqId = document.getElementById('comm-req-id').value;
      if(!reqId) return alert("請先點擊『儲存資料』！");
      if (typeof google !== 'undefined' && google.script) {
        google.script.url.getLocation(function(location) {
           let cleanUrl = location.href.split('?')[0]; 
           let finalLink = `${cleanUrl}?reqId=${reqId}`;
           const aTag = document.getElementById('client-link-href');
           aTag.href = finalLink; aTag.textContent = finalLink;
           document.getElementById('link-result-container').style.display = 'block';
        });
      }
    }

    async function loadRequirements() {
      const timelineEl = document.getElementById('timeline-list');
      timelineEl.innerHTML = '載入中...';
      try { 
        const reqs = await apiCall('getRequirements', {}); 
        timelineEl.innerHTML = reqs.length === 0 ? '無資料' : reqs.map(r => `<div style="border-bottom:1px solid #eee; padding:10px; text-align:left;"><b>${r.companyName}</b><br>單號: ${r.reqId}<br>狀態: ${r.status}<br><a href="javascript:void(0)" onclick='reverseEditForm(${JSON.stringify(r).replace(/'/g, "&apos;")})'>✏️ 載入修改</a></div>`).join('');
      } catch (err) { timelineEl.innerHTML = '載入失敗'; }
    }

    function reverseEditForm(item) {
      switchTab('tab1');
      document.getElementById('comm-req-id').value = item.reqId || '';
      document.getElementById('comm-row-id').value = item._rowId || '';
      document.getElementById('comm-company').value = item.companyName || '';
      document.getElementById('comm-rep').value = item.customerName || '';
      document.getElementById('comm-address').value = item.address || '';
      document.getElementById('comm-phone').value = item.phone || '';
      
      // 解析 JSON 還原 Textarea 內容
      try {
        if(item.contractTextJSON) {
          const t = JSON.parse(item.contractTextJSON);
          document.getElementById('txt-subject').value = t.subject || '';
          document.getElementById('txt-method').value = t.method || '';
          document.getElementById('txt-work-custom').value = t.workCustom || '';
          document.getElementById('txt-work-default').value = t.workDefault || '';
          document.getElementById('txt-fee-prefix').value = t.feePrefix || '';
          document.getElementById('txt-fee-custom').value = t.feeCustom || '';
          document.getElementById('txt-fee-suffix').value = t.feeSuffix || '';
          document.getElementById('txt-termination').value = t.termination || '';
          document.getElementById('txt-other-terms').value = t.otherTerms || '';
        }
      } catch(e) { console.warn("Parse Error:", e); }
      
      document.getElementById('link-result-container').style.display = 'none';
    }

    function escapeHtml(str) { if (!str) return ''; return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
  </script>
</body>
